<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Per-page title, description, keywords, robots and canonical are set
         by src/components/SEO.tsx. Don't duplicate them here: a static
         canonical would point every page at the homepage. -->
    <meta name="theme-color" content="#c81e1e" />

    <!-- Site-wide social preview fallbacks for crawlers that don't run JS -->
    <meta property="og:type" content="website" />

    <meta
      property="og:title"
      content="Pedzaworks Digital Solutions | Operational Software & Workflow Automation"
    />

    <meta
      property="og:description"
      content="Custom software development, workflow automation, business systems, websites, and IoT solutions designed to improve operations, efficiency, and growth."
    />

    <meta
      property="og:image"
      content="https://www.pedzaworks.com/og-image.jpg"
    />

    <meta
      property="og:site_name"
      content="Pedzaworks Digital Solutions"
    />

    <meta
      property="og:locale"
      content="en_US"
    />

    <!-- Twitter -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:site"
      content="@Pedzaworks"
    />

    <meta
      name="twitter:title"
      content="Pedzaworks Digital Solutions | Operational Software & Workflow Automation"
    />

    <meta
      name="twitter:description"
      content="Custom software development, workflow automation, business systems, websites, and IoT solutions designed to improve operations, efficiency, and growth."
    />

    <meta
      name="twitter:image"
      content="https://www.pedzaworks.com/og-image.jpg"
    />

    <!-- Website Schema (Helps Google determine your site name) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "url": "https://www.pedzaworks.com/",
        "name": "Pedzaworks Digital Solutions",
        "alternateName": "Pedzaworks"
      }
    </script>

    <!-- Organization Schema -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Pedzaworks Digital Solutions",
        "legalName": "Pedzaworks Digital Solutions Private Limited",
        "url": "https://www.pedzaworks.com/",
        "logo": "https://www.pedzaworks.com/logo.png",
        "image": "https://www.pedzaworks.com/logo.png",
        "email": "admin@pedzaworks.com",
        "telephone": "+263718719892",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Harare",
          "addressCountry": "ZW"
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+263718719892",
          "email": "admin@pedzaworks.com",
          "contactType": "customer service",
          "areaServed": "ZW",
          "availableLanguage": ["English"]
        },
        "description": "Pedzaworks Digital Solutions is a software-first engineering company specializing in operational software systems, workflow automation, business platforms, custom software development, websites, and IoT solutions.",
        "sameAs": [
          "https://www.linkedin.com/company/pedzaworks",
          "https://github.com/Pedzaworks"
        ]
      }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
