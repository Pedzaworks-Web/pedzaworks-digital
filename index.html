<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta name="theme-color" content="#c81e1e" />

    <!-- Per-page title, description, canonical, Open Graph and Twitter tags
         come from src/components/SEO.tsx and are injected here at build time
         by scripts/prerender.mjs. Don't add page-specific tags to this file. -->
    <!--app-head-->

    <!-- Site-wide structured data: website + organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://www.pedzaworks.com/#website",
            "url": "https://www.pedzaworks.com/",
            "name": "Pedzaworks Digital Solutions",
            "alternateName": "Pedzaworks",
            "inLanguage": "en",
            "publisher": {
              "@id": "https://www.pedzaworks.com/#organization"
            }
          },
          {
            "@type": [
              "Organization",
              "ProfessionalService"
            ],
            "@id": "https://www.pedzaworks.com/#organization",
            "name": "Pedzaworks Digital Solutions",
            "legalName": "Pedzaworks Digital Solutions Private Limited",
            "alternateName": "Pedzaworks",
            "url": "https://www.pedzaworks.com/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://www.pedzaworks.com/logo.png",
              "width": 512,
              "height": 512
            },
            "image": "https://www.pedzaworks.com/og-image.jpg",
            "description": "Pedzaworks Digital Solutions is a software-first engineering company in Harare, Zimbabwe, specializing in operational software systems, workflow automation, business platforms, custom software development, websites, and IoT solutions.",
            "email": "admin@pedzaworks.com",
            "telephone": "+263718719892",
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Harare",
              "addressCountry": "ZW"
            },
            "areaServed": [
              {
                "@type": "Country",
                "name": "Zimbabwe"
              },
              {
                "@type": "Continent",
                "name": "Africa"
              }
            ],
            "knowsAbout": [
              "Custom software development",
              "Workflow automation",
              "Business process automation",
              "ERP and operational platforms",
              "Systems integration",
              "Web development",
              "IoT solutions",
              "Industrial automation"
            ],
            "contactPoint": {
              "@type": "ContactPoint",
              "telephone": "+263718719892",
              "email": "admin@pedzaworks.com",
              "contactType": "customer service",
              "areaServed": "ZW",
              "availableLanguage": [
                "English"
              ]
            },
            "sameAs": [
              "https://www.linkedin.com/company/pedzaworks",
              "https://github.com/pedzaworks"
            ]
          }
        ]
      }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
